name: training_companion
version: "1.0.0"
config-version: 2
profile: training_companion

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # 분석 윈도우 — overview.py 의 --since-days 기본값과 맞춘다
  recent_window_days: 60

  # 품질 임계값. 실무에서 Airflow 태스크 안에 하드코딩돼 있던 숫자들을
  # 선언으로 끌어냈다 — 조정 이력이 git 에 남고, 테스트만 따로 돌릴 수 있다.
  volume_regression_pct: 5      # 직전 적재 대비 행 수 감소 허용폭 (%)
  freshness_max_days: 14        # 최신 활동이 이보다 오래되면 경고
  np_bias_max_w: 15             # NP 직접계산 vs Strava 평균 편향 상한 (측정값 8.04W)
  min_power_coverage_pct: 95    # 파워 라이딩의 per-point watts 커버리지 하한

  # 증상 비교용 부하 정의 (int_ride_load). 무릎 내측 건염 노트의 가설
  # "클라임 고토크·저케이던스에서 자극" 을 숫자로 옮긴 것이라, 바꾸면 이력이 git 에 남게 여기 둔다.
  grind_cadence_max: 75         # 이 케이던스 미만이면서
  grind_ftp_pct: 75             # FTP 의 이 % 이상 파워 → "저케이던스 고토크" 초
  climb_grade_min: 4            # 이 경사(%) 이상 → 클라임 초

seeds:
  training_companion:
    # 증상·피팅 기록은 개인 파일이 없으면 헤더만 있는 빈 시드가 된다.
    # 행이 없으면 타입을 추론할 수 없어 전부 문자열이 되므로 명시한다.
    symptom_log:
      +column_types:
        symptom_date: date
        activity_id: bigint
        severity: int
        next_day: int
    fitting_changes:
      +column_types:
        effective_date: date

models:
  training_companion:
    +file_format: iceberg
    intermediate:
      # 파워 커브는 여러 마트가 재사용하므로 테이블로 물질화한다.
      # ephemeral 로 두면 14개 윈도우 연산이 마트마다 반복된다.
      +materialized: table
      +schema: gold
    staging:
      # Iceberg 의 hadoop 카탈로그는 뷰를 지원하지 않는다
      # ("Replacing a view is not supported by catalog: tc").
      # staging 은 얇은 필터/선택이라 ephemeral 로 두면 마트에 CTE 로 인라인된다 —
      # 뷰도 필요 없고 저장소도 안 쓴다.
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: gold
