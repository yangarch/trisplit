version: 2

models:
  - name: mart_sport_totals
    description: 종목별 전 기간 누적 (overview.py 1절 이식). 중복 활동 제외.
    columns:
      - name: sport
        tests:
          - unique
          - not_null
          - accepted_values:
              values: [cycling, running, swimming, walking, other]
      - name: activities
        tests: [not_null]
      - name: distance_km
        tests: [not_null]

  - name: mart_yearly_summary
    description: 연도 × 종목 집계 (overview.py 2절 이식).
    tests:
      - dbt_utils_unique_combination:
          # dbt_utils 없이 쓰는 커스텀 제너릭 테스트 (macros/unique_combination.sql)
          combination_of_columns: [year, sport]
    columns:
      - name: year
        tests: [not_null]
      - name: sport
        tests: [not_null]

  - name: mart_gear_usage
    description: 자전거별 누적 사용 (overview.py 3절 이식). 장비 결정의 근거 수치.
    columns:
      - name: gear_label
        tests: [unique, not_null]
      - name: indoor_pct
        tests:
          - not_null
          - between:
              min_value: 0
              max_value: 100

  - name: mart_swim_pace_monthly
    description: >
      수영 월별 거리가중 평균 페이스 (overview.py 4절 이식).
      Strava 평균속도는 휴식 포함이라 강습/자유수영 분리 없이 추세 파악 용도로만 쓸 것.
    columns:
      - name: month
        tests: [unique, not_null]
      - name: pace_s_per_100m
        tests:
          # 100m 당 60~300초 밖이면 데이터가 이상한 것이다 (세계기록 ~47초, 걸어도 300초 안쪽)
          - between:
              min_value: 60
              max_value: 300

  - name: mart_ride_power
    description: >
      라이딩별 파워 지표. NP 를 원본 스트림에서 직접 계산하고 Strava 제공값과 대조한다.
      IF / TSS 는 ftp-log.md 의 현재값(283W) 기준.
    columns:
      - name: activity_id
        tests: [unique, not_null]
      - name: np_computed
        tests:
          - not_null
          - between: {min_value: 30, max_value: 600}
      - name: intensity_factor
        tests:
          # IF 가 1.5 를 넘으면 FTP 설정이 틀렸거나 파워 데이터가 깨진 것이다
          - between: {min_value: 0.1, max_value: 1.5}
      - name: tss
        tests:
          - between: {min_value: 0, max_value: 1500}

  - name: mart_riduck_metrics
    description: 라이덕이 활동 description 에 남긴 훈련부하 지표 (overview.py 3절 이식).
    columns:
      - name: activity_id
        tests: [unique, not_null]
      - name: sport
        tests: [not_null]
      - name: intensity
        tests:
          - between: {min_value: 0, max_value: 2}
      - name: implied_ftp
        tests:
          - between: {min_value: 100, max_value: 500}

  - name: int_power_curve_ride
    description: >
      라이딩 × 구간별 최고 파워 (Mean Maximal Power). 증분 모델.
      불완전 윈도우(활동보다 긴 구간)는 제외된다 — 그래서 구간이 길수록 유효 라이딩이 줄어든다.
    columns:
      - name: activity_id
        tests: [not_null]
      - name: duration_s
        tests:
          - not_null
          - accepted_values:
              values: [5, 15, 30, 60, 120, 300, 480, 720, 1200, 1800, 3600, 7200, 10800, 14400]
              quote: false
      - name: best_watts
        tests:
          - not_null
          - between: {min_value: 1, max_value: 2000}

  - name: mart_power_curve
    description: 구간별 최고 파워 (전 기간 / 최근 90일). 20분 값은 라이덕 피크파워와 일치 확인됨.
    tests:
      - dbt_utils_unique_combination:
          combination_of_columns: [duration_s, window_label]
    columns:
      - name: best_watts
        tests:
          - not_null
          - between: {min_value: 1, max_value: 2000}
      - name: window_label
        tests:
          - accepted_values: {values: ['all_time', 'recent_90d']}

  - name: mart_ftp_estimate
    description: >
      FTP 추정 — 20분×0.95 와 CP 모델 두 방법. ftp-log.md 현재값과의 차이를 함께 낸다.
      ⚠️ 최대 노력 기록이 데이터에 있어야 유효하다. 없으면 하한으로 읽을 것.
    columns:
      - name: window_label
        tests: [unique, not_null]
      - name: ftp_20min_x095
        tests:
          - not_null
          - between: {min_value: 80, max_value: 500}
      - name: cp_watts
        tests:
          - between: {min_value: 80, max_value: 500}
      - name: w_prime_joules
        # W′ 는 통상 5,000~40,000J. 이 범위를 벗어나면 회귀가 깨진 것이다
        tests:
          - between: {min_value: 1000, max_value: 60000}

  - name: mart_power_zones
    description: >
      파워 존 분포 (Coggan 7존, ftp-log 현재값 기준). 원본 watts 에서 직접 계산.
      Z1 에는 코스팅·정지(0W)가 포함된다 — 기성 도구와 같은 관행이다.
    tests:
      - dbt_utils_unique_combination:
          combination_of_columns: [activity_id, zone]
    columns:
      - name: zone
        tests:
          - not_null
          - accepted_values: {values: [1, 2, 3, 4, 5, 6, 7], quote: false}
      - name: pct_of_ride
        tests:
          - between: {min_value: 0, max_value: 100}

  - name: mart_ride_durability
    description: >
      3시간+ 라이딩의 후반/전반 NP 비율. 브레베·장거리에서 "10시간째에 얼마를 내는가" 를 본다.
    columns:
      - name: activity_id
        tests: [unique, not_null]
      - name: durability_ratio
        # 0.3 미만이면 사실상 중단, 2.0 초과면 데이터 이상
        tests:
          - between: {min_value: 0.3, max_value: 2.0}
