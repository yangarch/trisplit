version: 2

sources:
  - name: silver
    # dbt-spark 는 2단계 네임스페이스(schema.table)만 다룬다 — `database:` 를 쓰면
    # "Cannot set database in spark!" 로 죽는다.
    # 카탈로그는 profiles.yml 의 spark.sql.defaultCatalog=tc 가 정하므로
    # 여기서는 schema 만 지정하면 tc.silver.* 로 해석된다.
    schema: silver
    description: PySpark 로 정규화·중복판정까지 끝난 레이어. dbt 는 여기서부터 시작한다.
    tables:
      - name: activities
        description: 활동 1건 = 1행. is_duplicate 로 헤드유닛 동시기록 중복이 표시돼 있다.
        columns:
          - name: activity_id
            tests: [unique, not_null]
          - name: start_date_key
            # 2단계에서 정규식 이스케이프 문제로 날짜 컬럼이 전량 NULL 이 된 적이 있다.
            # 파이프라인은 "성공" 이라고 보고했고 눈으로 찾았다.
            # 이 한 줄이면 그때 바로 잡혔다.
            tests: [not_null]
          - name: sport
            tests:
              - not_null
              - accepted_values:
                  values: [cycling, running, swimming, walking, other]
          - name: is_duplicate
            tests: [not_null]
      - name: trackpoints
        description: 시계열 통합 (streams 우선, GPX 보조). watts 는 streams 소스에만 있다.
        columns:
          - name: activity_id
            tests: [not_null]
          - name: point_ts
            tests: [not_null]
          - name: source
            tests:
              - not_null
              - accepted_values:
                  values: [streams, gpx]
      - name: laps
      - name: splits

  - name: audit
    schema: audit
    description: >
      적재 시점에 (수집량, 적재량) 을 기록한 감사 로그. ingest/*.py 가 쓴다.
      dbt 는 테이블만 볼 수 있어 "소스 파일이 몇 개였는지" 를 알 방법이 없으므로,
      수집량을 데이터로 남겨야 "수집량 대비 적재량" 검증이 성립한다.
    tables:
      - name: ingest_runs
        columns:
          - name: source_count
            tests: [not_null]
          - name: loaded_count
            tests: [not_null]
